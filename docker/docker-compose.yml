# Full local stack: MinIO + Postgres + MLflow + Airflow + API + Prometheus + Grafana.
# Usage: docker compose -f docker/docker-compose.yml up -d --build
# Copy .env.example to .env to override defaults.

name: mlops-stack

x-minio-common: &minio-common
  image: minio/minio:RELEASE.2024-04-06T05-26-02Z
  command: server /data --console-address ":9001"
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 10s
    timeout: 5s
    retries: 5

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__DAG_DISPLAYED_SAFE_CHARS: "mlops"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/mlflow
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-demand_model}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
  AWS_ENDPOINT_URL: http://minio:9000
  DVC_REMOTE_URL: s3://${MINIO_BUCKET:-mlops-bucket}/data

services:
  minio:
    <<: *minio-common
    container_name: mlops-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    networks: [mlops]

  minio-init:
    image: minio/mc:RELEASE.2024-04-11T17-52-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-mlops-bucket} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-mlops-bucket}/data ||
      exit 0
      "
    networks: [mlops]

  postgres:
    image: postgres:16-alpine
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mlops]

  mlflow:
    build:
      context: ..
      dockerfile: mlflow/Dockerfile.mlflow
    image: mlops-mlflow:local
    container_name: mlops-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/mlflow
      ARTIFACT_ROOT: s3://${MINIO_BUCKET:-mlops-bucket}/mlflow-artifacts
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "5000:5000"
    volumes:
      - ../mlflow:/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/mlflow
      --default-artifact-root s3://${MINIO_BUCKET:-mlops-bucket}/mlflow-artifacts
      --artifacts-destination s3://${MINIO_BUCKET:-mlops-bucket}/mlflow-artifacts
      --allowed-hosts '*'
    networks: [mlops]

  train:
    profiles: ["train"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    image: mlops-training:local
    container_name: mlops-train
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-demand_model}
    volumes:
      - ../data:/app/data:ro
      - ../models:/app/models
    depends_on:
      mlflow:
        condition: service_started
    networks: [mlops]

  airflow:
    image: apache/airflow:2.9.2-python3.11
    container_name: mlops-airflow
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      <<: *airflow-env
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../airflow/plugins:/opt/airflow/plugins:ro
      - ../src:/opt/airflow/src:ro
      - ../scripts:/opt/airflow/scripts:ro
      - ../data:/opt/airflow/data
      - ../dvc.yaml:/opt/airflow/dvc.yaml:ro
      - ../.dvc:/opt/airflow/.dvc:ro
      - ../requirements.txt:/opt/airflow/requirements.txt:ro
    ports:
      - "8080:8080"
    command: >
      bash -c "
      pip install --no-cache-dir -r requirements.txt &&
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password ${AIRFLOW_ADMIN_PASSWORD:-admin} &&
      airflow scheduler & exec airflow webserver
      "
    networks: [mlops]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: mlops-api:local
    container_name: mlops-api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mlflow:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-demand_model}
      RELOAD_INTERVAL: ${RELOAD_INTERVAL:-60}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [mlops]

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: mlops-prometheus
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [mlops]

  grafana:
    image: grafana/grafana:11.0.0
    container_name: mlops-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [mlops]

volumes:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  mlops:
    driver: bridge
