# Pipeline outputs are versioned in Git in this repository, so every `outs`
# entry sets `cache: false`: DVC tracks it in dvc.lock for change detection
# and reproduction, but does not take ownership of the file.
stages:
  ingest:
    cmd: python3 src/data/ingestion.py
    deps:
      - data/external/dataset.csv
      - src/data/ingestion.py
    outs:
      - data/raw/dataset.csv:
          cache: false

  preprocess:
    cmd: python3 src/data/preprocessing.py
    deps:
      - data/raw/dataset.csv
      - src/data/preprocessing.py
    outs:
      - data/processed/demand_data.csv:
          cache: false

  build_features:
    cmd: python3 src/features/build_features.py
    deps:
      - data/processed/demand_data.csv
      - src/features/build_features.py
    outs:
      - data/features/features.parquet:
          cache: false
      - data/features/features_config.json:
          cache: false

  train:
    cmd: python3 src/models/train.py
    deps:
      - data/features/features.parquet
      - data/features/features_config.json
      - src/models/train.py
    outs:
      - models/model.pkl:
          cache: false
    metrics:
      - metrics.json:
          cache: false
