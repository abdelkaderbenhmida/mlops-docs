apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops-staging
resources:
  - namespace.yaml
  - ../../base
labels:
  - includeSelectors: false
    pairs:
      environment: staging
images:
  - name: mlops-api
    newName: mlops-api
    newTag: staging
patches:
  - path: deployment-patch.yaml
