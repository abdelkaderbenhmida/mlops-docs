name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check src airflow scripts
      - name: Black check
        run: black --check --line-length 120 src airflow scripts

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit scan
        run: bandit -r src -x tests -f json -o bandit-report.json || true
      - name: Fail on high severity findings
        run: |
          python - <<'EOF'
          import json
          try:
              with open("bandit-report.json") as fh:
                  report = json.load(fh)
          except FileNotFoundError:
              print("no bandit report generated")
              raise SystemExit(0)
          high = [r for r in report.get("results", []) if r.get("issue_severity") == "HIGH"]
          if high:
              for r in high:
                  print(f"HIGH: {r['filename']}:{r['line_number']} {r['test_id']} {r['issue_text']}")
              raise SystemExit(1)
          print(f"bandit: {len(report.get('results', []))} findings, no HIGH severity")
          EOF

  data-validation:
    name: Data validation (Great Expectations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate dataset
        run: python src/data/validation.py --input data/raw/dataset.csv

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Preprocess + build features (fixture for tests)
        run: |
          python src/data/preprocessing.py
          python src/features/build_features.py
      - name: Run unit tests
        run: pytest tests/unit -v --cov=src --cov-report=term-missing

  integration-tests:
    name: Integration tests (pipeline on sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run end-to-end pipeline
        run: |
          python src/data/ingestion.py
          python src/data/preprocessing.py
          python src/features/build_features.py
          MLFLOW_TRACKING_URI=sqlite:///mlruns/mlflow.db python src/models/train.py
          python src/models/evaluate.py
      - name: Run integration tests
        run: pytest tests/integration -v -m integration

  docker-build:
    name: Docker build test
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t mlops-api:ci .
      - name: Build training image
        run: docker build -f docker/Dockerfile.training -t mlops-training:ci .
      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mlops-api:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
