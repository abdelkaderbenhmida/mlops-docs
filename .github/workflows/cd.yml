name: CD

# ALL-LOCAL: cloud CI disabled — no GHCR pushes, no cloud runners, no remote k8s.
# Continuous delivery is performed from a local machine against a local cluster:
#   ./scripts/deploy-local.sh
# This workflow is kept as a manual, local-validation-only entry point
# (workflow_dispatch) and does not reach any cloud registry or cluster.

on:
  workflow_dispatch:

jobs:
  local-build-check:
    name: Local image build (all-local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfiles build locally (no push)
        run: |
          docker build -f docker/Dockerfile.api -t mlops-api:ci .
          docker build -f docker/Dockerfile.training -t mlops-training:ci .

# NOTE: Real local delivery (build + kubectl apply) runs on the local machine
# via scripts/deploy-local.sh. It is intentionally not in CI because the target
# cluster is local (air-gapped / on-prem) with no cloud runner access.