name: CD

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "k8s/**"
      - "requirements*.txt"
      - "dvc.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag (git sha, never latest)
        id: meta
        run: echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push training image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.training
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-training:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging + smoke tests
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" > $HOME/.kube/config
      - name: Update image tag via Kustomize
        run: |
          kustomize edit set image ghcr.io/mlops-project/mlops-api=${{ needs.build-and-push.outputs.image_tag }}
          kustomize build k8s/overlays/staging | kubectl apply -f -
      - name: Wait for rollout
        run: kubectl rollout status deployment/mlops-api --namespace=mlops --timeout=300s
      - name: Smoke tests
        run: |
          ENDPOINT=${{ secrets.STAGING_API_URL }}
          curl --fail --retry 10 --retry-delay 5 "$ENDPOINT/health"
          curl --fail -s -X POST "$ENDPOINT/predict" \
            -H "Content-Type: application/json" \
            -d '{"Gender":"Male","SeniorCitizen":0,"Partner":"No","Dependents":"No","Tenure":12,"PhoneService":"Yes","MultipleLines":"No","InternetService":"DSL","OnlineSecurity":"No","OnlineBackup":"Yes","DeviceProtection":"No","TechSupport":"No","StreamingTV":"No","StreamingMovies":"No","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":65.5,"TotalCharges":786.0}'

  deploy-production:
    name: Deploy production (manual approval)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" > $HOME/.kube/config
      - name: Update image tag via Kustomize
        run: |
          kustomize edit set image ghcr.io/mlops-project/mlops-api=${{ needs.build-and-push.outputs.image_tag }}
          kustomize build k8s/overlays/production | kubectl apply -f -
      - name: Rolling update with zero downtime
        run: |
          kubectl rollout status deployment/mlops-api --namespace=mlops --timeout=300s
      - name: Verify rollout health
        run: |
          kubectl get pods --namespace=mlops -l app=mlops-api
          kubectl get hpa --namespace=mlops
